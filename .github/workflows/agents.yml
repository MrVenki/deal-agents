name: agents

on:
  schedule:
    - cron: "0 */4 * * *"   # post
    - cron: "30 2 * * *"    # daily analysis
  workflow_dispatch:
    inputs:
      mode:
        description: post or analyze
        default: post

permissions:
  contents: write

concurrency:
  group: agents
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Run agents
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          AGENTS_PAUSED: ${{ vars.AGENTS_PAUSED }}
        run: node src/run.js ${{ github.event.schedule == '30 2 * * *' && 'analyze' || inputs.mode || 'post' }}
      - name: Save state and site
        run: |
          git config user.name "deal-agents"
          git config user.email "deal-agents@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "agents: update state and site" && git push)
