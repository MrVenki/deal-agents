name = "deal-redirect"
main = "redirect.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Origins (scheme + host only, comma separated) allowed to POST call-back leads to /lead.
[vars]
SITE_ORIGIN = "https://mrvenki.github.io,https://mathmyloan.com,https://www.mathmyloan.com"

# Create with: npx wrangler kv namespace create CLICKS  (paste the id below)
[[kv_namespaces]]
binding = "CLICKS"
id = "3e8ab46f3e804d5e96d4b956b0b3fa50"
